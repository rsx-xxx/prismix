<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Prismix</title>
  <link rel="stylesheet" href="mini.css">
  <script type="module" src="mini.js"></script>
</head>
<body>
  <p id="off" class="off">Open a song in Prismix to control it from here.</p>
  <main id="app" hidden>
    <header><img id="cover" alt="" width="48" height="48"><div class="who"><b id="title"></b><span id="sub"></span></div></header>
    <div class="row seek"><time id="cur">0:00</time><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position"><time id="dur">0:00</time></div>
    <div class="row xport"><button id="back" type="button" aria-label="Back 5 seconds">−5</button><button id="play" type="button" aria-label="Play or pause">▶</button><button id="fwd" type="button" aria-label="Forward 5 seconds">+5</button></div>
    <section class="tune">
      <div class="knob"><small>Tempo</small><div><button id="t-dn" type="button" aria-label="Slower">−</button><b id="t-out">100%</b><button id="t-up" type="button" aria-label="Faster">+</button></div><span id="bpm"></span></div>
      <div class="knob"><small>Key</small><div><button id="k-dn" type="button" aria-label="Down a semitone">−</button><b id="k-out">0</b><button id="k-up" type="button" aria-label="Up a semitone">+</button></div><span id="key"></span></div>
    </section>
    <label class="vol"><small>Master</small><input id="master" type="range" min="0" max="100" aria-label="Master volume"><output id="master-out"></output></label>
    <section id="stems" aria-label="Stems"></section>
  </main>
</body>
</html>
