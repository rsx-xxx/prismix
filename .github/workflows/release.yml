name: Build & Release

on:
  push:
    tags:
      - 'v*'          # versioned GitHub Release: git tag v1.0.0 && git push --tags
  workflow_dispatch:   # manual build

permissions:
  contents: write

# A newer tag supersedes a build that is still running: stop the old one instead of finishing a release nobody will use.
concurrency:
  group: build-and-release
  cancel-in-progress: true

env:
  PRISMIX_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.{0}', github.run_number) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC login to Azure for code signing, no stored password
    env:
      # Signing turns on by itself once the Azure secrets exist (see packaging/SIGNING.md); without them the build stays unsigned.
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: uv sync --group desktop
      - name: Build app
        run: |
          uv run --group desktop python packaging/gen_icon.py
          uv run --group desktop python packaging/build.py
      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Prismix.exe
        if: env.SIGN == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist/Prismix
          files-folder-filter: exe
      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Prismix/Prismix.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "bundled self-test failed with exit code $($p.ExitCode)" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "packaging\Prismix.iss" "/DAppVersion=$($Env:PRISMIX_VERSION.TrimStart('v'))"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Prismix-Setup.exe

  build-mac:
    needs: test
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: uv sync --group desktop
      - name: Build app
        run: |
          uv run --group desktop python packaging/gen_icon.py
          uv run --group desktop python packaging/build.py
      - name: Smoke test the bundle
        run: dist/Prismix.app/Contents/MacOS/Prismix --selftest
      - name: Build DMG
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/make_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/Prismix.dmg

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PRISMIX_VERSION: ${{ env.PRISMIX_VERSION }}
        run: |
          # A fixed signing key lets a new APK install over the old one; without the secret a throwaway key is used.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/band.keystore"
            export PRISMIX_KEYSTORE="$RUNNER_TEMP/band.keystore"
          fi
          sh android/build.sh
          cp android/build/prismix.apk android/build/Prismix.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/build/Prismix.apk

  # Tag pushes get a versioned release; everything else updates a rolling 'latest' release.
  release:
    needs: [build-windows, build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move rolling 'latest' tag to this commit
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin -f latest
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Write release notes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            awk -v v="$v" '/^## /{on=($2==v)} on&&!/^## /' CHANGELOG.md | sed '/./,$!d' > release-notes.md
            [ -s release-notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          else
            echo "Automatically built from commit $GITHUB_SHA on master." > release-notes.md
          fi
          cat packaging/release-footer.md >> release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Prismix {0}', github.ref_name) || 'Prismix (latest master build)' }}
          body_path: release-notes.md
          files: |
            artifacts/windows/Prismix-Setup.exe
            artifacts/mac/Prismix.dmg
            artifacts/android/Prismix.apk
          draft: false
          prerelease: false
          make_latest: true

  homebrew:
    # Bumps the cask in the rsx-xxx/homebrew-prismix tap so `brew upgrade --cask prismix` sees each tagged release.
    # Needs the repo secret TAP_TOKEN (fine-grained PAT, Contents: read/write on the tap repo only); skipped without it.
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.TAP_TOKEN != ''
      - name: Update cask
        if: env.TAP_TOKEN != ''
        run: |
          v="${GITHUB_REF_NAME#v}"
          curl -fsSL -o Prismix.dmg "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Prismix.dmg"
          sha=$(sha256sum Prismix.dmg | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/rsx-xxx/homebrew-prismix.git" tap
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"$v\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" packaging/homebrew/prismix.rb > tap/Casks/prismix.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/prismix.rb
          git diff --cached --quiet || { git commit -m "prismix $v"; git push; }
