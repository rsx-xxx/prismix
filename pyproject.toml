[project]
name = "prismix"
version = "0.0.24"
description = "Practice any song with your band: split it into stems, see chords and synced lyrics, change tempo and key, and follow along on phones."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp[default]>=2026.10.21",
    "demucs==4.1.0",
    "bs-roformer-infer>=0.1.5",
    "torch>=2.8",
    "numpy>=2.0",
    "imageio-ffmpeg>=0.6",
    "pylibrb>=0.1.2",
    "beat-this>=1.1.0",
    "transformers>=4.45",
    "librosa>=0.11.0",
    "huggingface-hub>=2.3.0",
    "httpx>=0.28",
    "einops>=0.8",
    "beartype>=0.19",
    "rotary-embedding-torch>=0.8",
    "python-multipart>=0.0.20",
    "setuptools<81",
    "cryptography>=43",
    "segno>=1.6",
    "zeroconf>=0.132",
]

[dependency-groups]
desktop = [
    "pillow>=13.0.0",
    "pyinstaller>=6.10",
    "pywebview>=5.3",
]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[project.scripts]
prismix = "prismix.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prismix"]

[tool.ruff]
extend-exclude = ["prismix/vendor"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# demucs pins numpy<2 on Intel macOS; Apple Silicon, Linux and Windows are supported
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
# basic-pitch lists TensorFlow/CoreML as hard deps, but it also ships an ONNX model that runs
# on onnxruntime alone. Neutralise the heavy ones so the install stays light.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "tflite-runtime; sys_platform == 'never'",
    "coremltools; sys_platform == 'never'",
]
